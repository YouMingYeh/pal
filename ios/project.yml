name: Pal
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Pal:
    type: application
    platform: iOS
    sources: [Pal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pal.spike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Pal/Info.plist
      properties:
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        PalAPIURL: $(PAL_API_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  PalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PalTests]
    dependencies:
      - target: Pal
schemes:
  Pal:
    build:
      targets:
        Pal: all
        PalTests: [test]
    test:
      targets: [PalTests]
